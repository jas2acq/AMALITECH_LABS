services:
  # ZooKeeper service - required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1 # Using a specific version for consistency
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181" # Expose ZooKeeper client port
    environment:
      # Basic ZooKeeper configuration
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      # Persist ZooKeeper data
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  # Kafka service
  kafka:
    image: confluentinc/cp-kafka:7.0.1 # Using a specific version matching ZooKeeper
    hostname: kafka
    container_name: kafka
    ports:
      # Map Kafka broker port to host. This is crucial for external clients (like your Python scripts) to connect.
      - "9092:9092"
    environment:
      # Kafka broker ID - unique identifier for the broker
      KAFKA_BROKER_ID: 1
      # ZooKeeper connection string
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Using a simplified listener configuration for single broker in Docker
      # Defines a single listener named 'BROKER'
      KAFKA_LISTENERS: BROKER://:9092
      # Advertises the listener for external clients (using localhost and mapped port)
      KAFKA_ADVERTISED_LISTENERS: BROKER://localhost:9092
      # Maps the 'BROKER' listener to the PLAINTEXT security protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT
      # Specifies 'BROKER' as the listener name for inter-broker communication (even for a single broker)
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      # Topic auto-creation enabled (useful for development)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Set to 1 for development/single broker
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      # Persist Kafka log data
      - kafka-data:/var/lib/kafka/data
    depends_on:
      # Kafka depends on ZooKeeper being healthy
      - zookeeper

  # PostgreSQL database service
  postgres:
    image: postgres:13 # Using a specific version
    hostname: postgres
    container_name: postgres-kafka
    ports:
      # Map PostgreSQL port to host
      - "5432:5432"
    environment:
      # Set PostgreSQL user, password, and database name
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: heartbeatdb
    volumes:
      # Persist PostgreSQL data
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Healthcheck to ensure the database is ready before other services try to connect
      test: [ "CMD-SHELL", "pg_isready -U user -d heartbeatdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

# Define named volumes for data persistence
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
