services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - MPLCONFIGDIR=/tmp/matplotlib
      - PATH=/opt/bitnami/python/bin:/opt/bitnami/spark/bin:/opt/bitnami/spark/sbin:/opt/bitnami/java/bin:/opt/bitnami/common/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/.local/bin
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - spark-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    command: bash -c "/opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.master.Master"

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - MPLCONFIGDIR=/tmp/matplotlib
      - PATH=/opt/bitnami/python/bin:/opt/bitnami/spark/bin:/opt/bitnami/spark/sbin:/opt/bitnami/java/bin:/opt/bitnami/common/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/.local/bin
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./requirements.txt:/app/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /app/requirements.txt &&
               /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    networks:
      - spark-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  spark-worker-2:
    image: bitnami/spark:latest
    container_name: spark-worker-2
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - MPLCONFIGDIR=/tmp/matplotlib
      - PATH=/opt/bitnami/python/bin:/opt/bitnami/spark/bin:/opt/bitnami/spark/sbin:/opt/bitnami/java/bin:/opt/bitnami/common/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/.local/bin
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./requirements.txt:/app/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /app/requirements.txt &&
               /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    networks:
      - spark-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  python:
    image: bitnami/spark:latest
    container_name: python-runner
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYTHONPATH=/app/src
      - MPLCONFIGDIR=/tmp/matplotlib
      - PATH=/opt/bitnami/python/bin:/opt/bitnami/spark/bin:/opt/bitnami/spark/sbin:/opt/bitnami/java/bin:/opt/bitnami/common/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/.local/bin
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./requirements.txt:/app/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /app/requirements.txt && python /app/src/main.py"
    networks:
      - spark-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

networks:
  spark-network:
    driver: bridge
